<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | CampusFind</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">

        <a href="index.html" class="logo">
            Campus<span>Find</span>
        </a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="items.html">Browse Items</a>
            <a href="login.html">Login</a>
            <a href="register.html" class="nav-btn">Register</a>
        </div>

    </nav>


    <!-- REGISTER -->
    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-header">

                <h1>Create Account</h1>

                <p>
                    Join CampusFind and help reunite lost items
                </p>

            </div>


            <form id="registerForm">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        College Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your college email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <button type="submit" class="auth-btn">
                    Create Account
                </button>

            </form>


            <div class="auth-footer">

                <p>
                    Already have an account?
                    <a href="login.html">Login</a>
                </p>

            </div>

        </div>

    </main>


    <!-- FOOTER -->
    <footer>

        <div class="footer-logo">
            Campus<span>Find</span>
        </div>

        <p>
            College Lost & Found Platform
        </p>

        <p class="copyright">
            © 2026 CampusFind. All rights reserved.
        </p>

    </footer>

</body>

</html>
