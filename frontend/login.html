<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CampusFind</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">

        <a href="index.html" class="logo">
            Campus<span>Find</span>
        </a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="items.html">Browse Items</a>
            <a href="login.html">Login</a>
            <a href="register.html" class="nav-btn">Register</a>
        </div>

    </nav>


    <!-- LOGIN SECTION -->
    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-header">

                <h1>Welcome Back</h1>

                <p>
                    Login to your CampusFind account
                </p>

            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your college email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="form-options">

                    <label class="remember">
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <button type="submit" class="auth-btn">
                    Login
                </button>

            </form>


            <div class="auth-footer">

                <p>
                    Don't have an account?
                    <a href="register.html">Create Account</a>
                </p>

            </div>

        </div>

    </main>


    <!-- FOOTER -->
    <footer>

        <div class="footer-logo">
            Campus<span>Find</span>
        </div>

        <p>
            College Lost & Found Platform
        </p>

        <p class="copyright">
            © 2026 CampusFind. All rights reserved.
        </p>

    </footer>

</body>

</html>
